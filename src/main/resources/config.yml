# RealisticTerrain 1.18+ 真实地形生成器
#
# 这个生成器只影响“新生成的区块”。已经生成过的区块不会被改写；
# 请用新世界（或在备份后清空区块）来体验。
#
# 启用方式（bukkit.yml）：
#   worlds:
#     world:
#       generator: RealisticTerrain:realistic

world:
  # 海平面（绝对 Y）。1.18 默认世界范围是 -64 ~ 320。
  # 默认 96，给海洋、平原和高山都留出足够空间。
  sea-level: 96

  # 地形最高点（绝对 Y）。生成器最高只会把地形写到这个高度，
  # 上面留给树木、建筑和天空。默认 304，正好是“304 格”上限。
  # 会被世界最大高度 - 16 自动钳制（1.18 默认世界为 304）。
  max-terrain-y: 304

  # 基岩层厚度（从世界最低点往上）。1 ~ 5。
  bedrock-depth: 3

terrain:
  # 大陆尺度。大于 1 = 更大的大陆与海洋，小于 1 = 更破碎。
  continent-scale: 1.0

  # 整体高度缩放（以海平面为中心）。
  height-scale: 1.0

  # 山脉最大抬升高度（格）。默认 170，配合 304 的上限形成高山。
  mountain-height: 170

  # 深海相对海平面的最大深度（格）。
  ocean-depth: 58

  # 三维起伏强度。越大，悬崖、山脊和局部悬垂越明显。
  roughness: 1.0

  # 河流开关与宽度倍率。
  rivers: true
  river-width: 1.0

caves:
  # 洞穴总开关。
  enabled: true

  # 洞穴密度（0.0 ~ 1.5）。1.0 约等于“常规”密度，
  # 默认 0.35 = 明显更稀疏：隧道更细、成片出现的区域更少。
  density: 0.35

  # 洞穴底部岩浆高度（绝对 Y）。低于这个高度的洞穴会被岩浆填满。
  lava-level: -54

  # 是否在低处生成岩浆而不是空气。
  lava-lakes: true

ores:
  # 插件自带的矿物与岩层团块。
  enabled: true

  # 矿物数量倍率。1.0 为默认；0.5 更稀有。
  density: 1.0

  # 花岗岩、闪长岩、安山岩、凝灰岩、砂砾等地质团块。
  geology: true

features:
  # 保留原版植被（树、草、花、雪层等）。关闭后世界会非常光秃。
  vanilla-decoration: true

  # 原版结构（村庄、要塞、废弃矿井等）。自定义地形上容易悬空，
  # 默认关闭。打开前请自行评估。
  vanilla-structures: false

  # 原版动物/怪物生成。
  vanilla-mobs: true

# 在控制台输出每个区块的生成耗时（排查性能时用）。
debug: false
